// defaults.cfg - executed first at every start (server.cfg, then your EXTRA_CFG, override it).
// Copied from the image to <data>/__rPAMv115b5/ each time: edits made in the volume are lost.

seta sv_punkbuster "0"
seta sv_pure "1"                // clients must hold the same pk3s (the COD1.6X PAM button installs them)
seta sv_allowDownload "1"       // extra maps from maps/ download from the server itself
seta sv_wwwDownload "0"
seta sv_floodProtect "1"
seta sv_maxPing "0"
seta sv_minPing "0"
seta sv_maxRate "25000"         // only applies to non-LAN addresses: LAN clients are never rate limited
seta sv_privateClients "0"
seta sv_privatePassword ""
seta g_useGear "0"              // COD1.6X: no attached gear (also forced by cod1plus.so)
seta g_log "games_mp.log"
seta g_logsync "1"
seta logfile "2"

// LAN party: no internet master (a LAN address is useless to the rest of the world).
// For an internet server use DEDICATED=2 and set the masters in your EXTRA_CFG.
seta sv_master1 ""
seta sv_master2 ""
seta sv_master3 ""
seta sv_master4 ""
seta sv_master5 ""

seta scr_friendlyfire "1"
seta scr_killcam "0"
seta scr_teambalance "0"
seta scr_spectateenemy "0"
seta scr_freelook "0"
seta scr_drawfriend "1"
